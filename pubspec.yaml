name: daftar_afandi
description: "دفتر أفندي — Daftar Afandi: offline shop accounting"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7 <3.48.0"

# All direct dependencies are pinned exactly (constitution V, decision Q2).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  material_ui: 1.5.0
  flutter_bloc: 9.1.1
  go_router: 18.0.2
  drift: 2.35.1
  drift_flutter: 0.3.1
  get_it: 9.3.0
  uuid: 4.6.0
  flutter_screenutil: 5.9.3
  intl: 0.20.3
  path_provider: 2.1.6
  package_info_plus: 10.2.2
  equatable: 3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: 2.16.1
  drift_dev: 2.35.1
  bloc_test: 10.0.0
  mocktail: 1.0.5
  flutter_lints: 6.0.0

# 14-day rule holds (decisions Q3, A2). Remove each entry once the newer version is 14 days old.
dependency_overrides:
  sqlite3: 3.7.0 # remove after 2026-10-27
  cupertino_ui: 1.1.1 # remove after 2026-10-28
  # Dev-only transitives (build_runner / drift_dev / test), approval A2.
  build_daemon: 4.1.6 # remove after 2026-10-28
  coverage: 1.15.1 # remove after 2026-10-27
  dart_style: 3.1.13 # remove after 2026-10-29
  shelf: 1.4.2 # remove after 2026-10-30
  shelf_static: 1.1.3 # remove after 2026-10-30
  vm_service: 15.3.0 # remove after 2026-10-29

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/fonts/OFL.txt

  # Only the four weights the typography uses (400/500/600/700).
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
