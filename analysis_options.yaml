include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - lib/core/l10n/generated/**

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - always_declare_return_types
    - avoid_print
    - directives_ordering
    - unawaited_futures
